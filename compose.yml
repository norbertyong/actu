services:
  web:
    image: actu:dev
    build: .
    ports:
      - "127.0.0.1:${ACTU_PORT:-8000}:8000"
    environment:
      ACTU_ADMIN_USER: ${ACTU_ADMIN_USER:-}
      ACTU_ADMIN_PASSWORD_HASH: ${ACTU_ADMIN_PASSWORD_HASH:-}
      ACTU_ADMIN_PASSWORD: ${ACTU_ADMIN_PASSWORD:-}
      ACTU_HTTPS: ${ACTU_HTTPS:-0}
    volumes:
      - actu-data:/app/storage
    restart: unless-stopped
  collector:
    image: actu:dev
    depends_on:
      - web
    command: ["sh", "-c", "while :; do php bin/collect.php; sleep 1200; done"]
    volumes:
      - actu-data:/app/storage
    restart: unless-stopped
volumes:
  actu-data:
